services:
  # Servicio Backend: FastAPI + LangChain + FAISS + Cohere
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: novaterra-backend
    restart: always
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - PORT=8000
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks:
      - novaterra-network

  # Servicio Frontend: React 18 + Vite + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: novaterra-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - novaterra-network

networks:
  novaterra-network:
    name: novaterra-network
    driver: bridge
